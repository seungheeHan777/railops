services:
  postgres:
    image: postgres:16-alpine
    container_name: railops-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: railops
      POSTGRES_USER: railops
      POSTGRES_PASSWORD: railops
    volumes:
      - railops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railops -d railops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  railops-postgres-data: