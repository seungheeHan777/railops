spring.application.name=RailOps
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${RAILOPS_FLYWAY_BASELINE:false}
spring.flyway.baseline-version=1
management.server.port=${RAILOPS_MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.health.redis.enabled=false
railops.bootstrap-admin.enabled=${RAILOPS_BOOTSTRAP_ADMIN:false}
railops.fare.default-seat-price=${RAILOPS_DEFAULT_SEAT_PRICE:50000}

railops.jwt.secret=${RAILOPS_JWT_SECRET:railops-local-development-secret-key-change-me}
railops.jwt.expiration-seconds=${RAILOPS_JWT_EXPIRATION_SECONDS:3600}
