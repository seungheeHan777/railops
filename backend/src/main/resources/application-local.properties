spring.datasource.url=${RAILOPS_DB_URL:jdbc:postgresql://localhost:5432/railops}
spring.datasource.username=${RAILOPS_DB_USERNAME:railops}
spring.datasource.password=${RAILOPS_DB_PASSWORD:railops}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.data.redis.host=${RAILOPS_REDIS_HOST:localhost}
spring.data.redis.port=${RAILOPS_REDIS_PORT:6379}